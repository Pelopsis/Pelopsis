<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="winClip">
      <rect x="40" y="24" width="820" height="252" rx="14"/>
    </clipPath>
  </defs>

  <rect width="900" height="300" fill="#02120a"/>

  <!-- Matrix rain (background) -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#1c6b38">
    <text x="80" y="0"><tspan x="80" dy="0" opacity="1">1</tspan><tspan x="80" dy="16" opacity="0.7">0</tspan><tspan x="80" dy="16" opacity="0.4">1</tspan><tspan x="80" dy="16" opacity="0.2">0</tspan>
      <animateTransform attributeName="transform" type="translate" values="0,-120;0,420" dur="5.2s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="0"><tspan x="150" dy="0" opacity="1">0</tspan><tspan x="150" dy="16" opacity="0.7">1</tspan><tspan x="150" dy="16" opacity="0.4">0</tspan><tspan x="150" dy="16" opacity="0.2">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0,-160;0,420" dur="4.4s" begin="1.1s" repeatCount="indefinite"/>
    </text>
    <text x="740" y="0"><tspan x="740" dy="0" opacity="1">1</tspan><tspan x="740" dy="16" opacity="0.7">1</tspan><tspan x="740" dy="16" opacity="0.4">0</tspan><tspan x="740" dy="16" opacity="0.2">0</tspan>
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,420" dur="4.8s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="820" y="0"><tspan x="820" dy="0" opacity="1">0</tspan><tspan x="820" dy="16" opacity="0.7">1</tspan><tspan x="820" dy="16" opacity="0.4">1</tspan><tspan x="820" dy="16" opacity="0.2">0</tspan>
      <animateTransform attributeName="transform" type="translate" values="0,-180;0,420" dur="5.6s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="15" y="0"><tspan x="15" dy="0" opacity="1">0</tspan><tspan x="15" dy="16" opacity="0.7">0</tspan><tspan x="15" dy="16" opacity="0.4">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0,-100;0,420" dur="4.1s" begin="1.7s" repeatCount="indefinite"/>
    </text>
    <text x="865" y="0"><tspan x="865" dy="0" opacity="1">1</tspan><tspan x="865" dy="16" opacity="0.7">0</tspan><tspan x="865" dy="16" opacity="0.4">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0,-130;0,420" dur="4.9s" begin="0.3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Terminal window -->
  <rect x="40" y="24" width="820" height="252" rx="14" fill="#03110a" fill-opacity="0.92" stroke="#1f7a45" stroke-width="1.2"/>

  <!-- Title bar -->
  <rect x="40" y="24" width="820" height="30" rx="14" fill="#08221340"/>
  <circle cx="64" cy="39" r="5.5" fill="#ff5f57"/>
  <circle cx="84" cy="39" r="5.5" fill="#febc2e"/>
  <circle cx="104" cy="39" r="5.5" fill="#28c840"/>
  <text x="450" y="43" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6fae82">yusuf@ubt:~</text>
  <line x1="40" y1="54" x2="860" y2="54" stroke="#1f7a45" stroke-width="1"/>

  <!-- Shell session -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" filter="url(#glow)">
    <text x="64" y="90" opacity="0">
      <tspan fill="#39ff14">guest@kosovo:~$ </tspan><tspan fill="#d8ffe0">whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="64" y="122" fill="#9fe6b0" opacity="0">
      yusuf.avci — computer science &amp; engineering student, UBT University
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
    </text>
    <text x="64" y="158" opacity="0">
      <tspan fill="#39ff14">guest@kosovo:~$ </tspan><tspan fill="#d8ffe0">cat interests.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>
    </text>
    <text x="64" y="190" fill="#9fe6b0" opacity="0">
      clean code &#183; low-level curiosity &#183; building things that work
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.9s" fill="freeze"/>
    </text>
    <text x="64" y="226" opacity="0">
      <tspan fill="#39ff14">guest@kosovo:~$ </tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.1s" fill="freeze"/>
    </text>
    <rect x="190" y="212" width="9" height="17" fill="#39ff14" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CRT scanline sweep -->
  <g clip-path="url(#winClip)">
    <rect x="40" y="24" width="820" height="6" fill="#39ff14" opacity="0.05">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,246;0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
