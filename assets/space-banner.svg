<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020024"/>
      <stop offset="45%" stop-color="#0a0e2c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="35%" stop-color="#ffd36e"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f4f4f8"/>
      <stop offset="100%" stop-color="#9a9ab0"/>
    </radialGradient>
    <radialGradient id="earthOcean" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5fc2ff"/>
      <stop offset="60%" stop-color="#2f7bd1"/>
      <stop offset="100%" stop-color="#123a6b"/>
    </radialGradient>
    <linearGradient id="meteorTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="earthClip">
      <circle cx="120" cy="235" r="52"/>
    </clipPath>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="70" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="20" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="110" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="150" r="1.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="60" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="25" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="130" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="80" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="150" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="110" r="1.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="170" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="200" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="180" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="220" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="240" r="1.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="250" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="30" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Güneş -->
  <g filter="url(#glow)">
    <circle cx="810" cy="55" r="34" fill="url(#sunGrad)">
      <animate attributeName="r" values="34;37;34" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ay -->
  <g filter="url(#glow)">
    <circle cx="260" cy="55" r="18" fill="url(#moonGrad)"/>
    <circle cx="267" cy="49" r="3" fill="#7f7f95" opacity="0.6"/>
    <circle cx="255" cy="60" r="2" fill="#7f7f95" opacity="0.5"/>
  </g>

  <!-- Dünya (dönerek) -->
  <g clip-path="url(#earthClip)">
    <circle cx="120" cy="235" r="52" fill="url(#earthOcean)"/>
    <g>
      <path d="M85 210 q20 -15 45 -5 q10 10 -5 20 q-25 10 -40 -15 Z" fill="#3fae5a"/>
      <path d="M130 250 q25 -10 35 5 q5 15 -20 15 q-20 -5 -15 -20 Z" fill="#3fae5a"/>
      <path d="M95 260 q15 -5 20 10 q-5 10 -20 5 q-10 -5 0 -15 Z" fill="#3fae5a"/>
      <animateTransform attributeName="transform" type="rotate" from="0 120 235" to="360 120 235" dur="50s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="120" cy="235" r="52" fill="none" stroke="#8fd3ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Meteorlar -->
  <g>
    <line x1="0" y1="0" x2="55" y2="18" stroke="url(#meteorTail)" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="700,-20; 380,140" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="60" y2="20" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="500,-30; 150,150" dur="3.1s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3.1s" begin="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="50" y2="16" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="850,-20; 600,120" dur="2.4s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="2.4s" begin="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="45" y2="15" stroke="url(#meteorTail)" stroke-width="1.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="300,-25; 30,130" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="55" y2="17" stroke="url(#meteorTail)" stroke-width="2.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="620,-30; 350,140" dur="2.9s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="2.9s" begin="3.4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
